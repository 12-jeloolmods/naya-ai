<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAYA - AI</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(135deg, #ffe4ec, #ffd6f0);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px;
  color: #ff4da6;
  font-weight: bold;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.message {
  margin: 5px;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #ff69b4;
  color: white;
  margin-left: auto;
}

.ai {
  background: #fff0f5;
}

.input-area {
  display: flex;
  padding: 10px;
  background: white;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
  background: #ff69b4;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="header">🌸 NAYA - AI</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
  <input id="input" placeholder="Ketik...">
  <button onclick="send()">Kirim</button>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  const box = document.getElementById("chatBox");

  box.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  box.innerHTML += `<div class="message ai">${data.reply}</div>`;
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
