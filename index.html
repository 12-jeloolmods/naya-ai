<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAYA - AI</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ffe4ec, #ffd6f0);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px 20px;
  font-weight: bold;
  font-size: 18px;
  color: #ff4da6;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 65%;
  padding: 10px 14px;
  border-radius: 15px;
  font-size: 14px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

.ai {
  background: #fff0f5;
  align-self: flex-start;
}

.user {
  background: #ff69b4;
  color: white;
  align-self: flex-end;
}

.input-area {
  display: flex;
  padding: 10px;
  background: white;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  margin-left: 10px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #ff69b4;
  color: white;
  cursor: pointer;
}

.loading {
  font-size: 12px;
  color: #999;
}
</style>
</head>

<body>

<div class="header">🌸 NAYA - AI</div>

<div class="chat-box" id="chatBox">
  <div class="message ai">Haii~ aku NAYA 💖 Tanya apa aja yaa 🌸</div>
</div>

<div class="input-area">
  <input id="userInput" placeholder="Ketik sesuatu... 💕">
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>
function typingEffect(el, text, speed = 20) {
  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

document.getElementById("userInput").addEventListener("keypress", function(e){
  if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  const chatBox = document.getElementById("chatBox");

  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.textContent = text;
  chatBox.appendChild(userMsg);

  input.value = "";

  const aiMsg = document.createElement("div");
  aiMsg.className = "message ai loading";
  aiMsg.textContent = "NAYA lagi mikir manis... 🌸💖";
  chatBox.appendChild(aiMsg);

  // custom respon
  if (text.toLowerCase().includes("siapa yg menciptakan")) {
    aiMsg.classList.remove("loading");
    aiMsg.textContent = "";
    typingEffect(aiMsg, "Aku diciptakan oleh Fajar Kurniawan, anak SMK jurusan TSM yang jago banget ngoding 💖🌸");
    return;
  }

  try {
    const res = await fetch("chat.php", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    aiMsg.classList.remove("loading");
    aiMsg.textContent = "";

    typingEffect(aiMsg, data.reply + " 🌸💖");

  } catch {
    aiMsg.textContent = "Koneksi error 😢🌸";
  }

  chatBox.scrollTo({
    top: chatBox.scrollHeight,
    behavior: "smooth"
  });
}
</script>

</body>
</html>
